[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-remit"
version = "0.1.0"
description = "Nigeria remittance timing & fees assistant with Intel OpenVINO local intent routing"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Joshua Jubelo" }]
dependencies = [
  "streamlit>=1.32.0",
  "python-dotenv>=1.0.0",
  "numpy>=1.26.0",
  "openvino>=2024.0.0",
]

[project.optional-dependencies]
dev = []

[tool.setuptools.packages.find]
where = ["src"]
